name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.godot'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages for Godot 4.3
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Set up Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths and debug signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "---- Godot Android settings ----"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "---- Android SDK packages ----"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/ndk"

      - name: Verify tools and validate project
        run: |
          mkdir -p build
          set -o pipefail
          godot --version
          java -version
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          godot --headless --editor --path . --quit --verbose 2>&1 | tee build/godot-validation.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" build/godot-validation.log; then
            echo "Godot script validation failed; refusing to export APK."
            exit 1
          fi
          godot --headless --path . --quit-after 120 --verbose 2>&1 | tee build/runtime-smoke-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:" build/runtime-smoke-test.log; then
            echo "Runtime smoke test failed; refusing to export APK."
            exit 1
          fi

      - name: Export Android APK with diagnostics
        run: |
          set -o pipefail
          godot --headless --path . --verbose --export-debug "Android" build/Bo-Lac-Tien-Su.apk 2>&1 | tee build/android-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR:" build/android-export.log; then
            echo "Export reported script errors; refusing to publish APK."
            exit 1
          fi
          test -s build/Bo-Lac-Tien-Su.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bo-Lac-Tien-Su-Android-APK
          path: build/Bo-Lac-Tien-Su.apk
          if-no-files-found: error
          retention-days: 14
