name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.godot'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          godot --headless --editor --path . --quit || true

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Bo-Lac-Tien-Su.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bo-Lac-Tien-Su-Android-APK
          path: build/Bo-Lac-Tien-Su.apk
          if-no-files-found: error
          retention-days: 14
